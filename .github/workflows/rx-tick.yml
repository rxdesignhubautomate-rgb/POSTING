name: RX Studio tick

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call RX Studio worker
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Missing GitHub secret APP_URL. Set it to your deployed app URL, for example https://posting-pi.vercel.app"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing GitHub secret CRON_SECRET. It must match the CRON_SECRET environment variable in Vercel."
            exit 1
          fi
          APP_URL="${APP_URL%/}"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location --output "$response_file" --write-out "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/tick?limit=6")"
          echo "RX Studio tick HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::RX Studio tick failed with HTTP $status. See response body above."
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
